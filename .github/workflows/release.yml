# Empty-corpus release APK, built on version tags only.
#
# Policy: the APK contains no game code or data (the build runs with no
# corpus properties, exactly like the CI Android job). Uploads are the APK,
# THIRD_PARTY_NOTICES.txt and SHA256SUMS. Signing uses a stable maintainer
# cert from secrets (ANDROID_KEYSTORE_BASE64 + passwords); versionCode is
# derived from the tag so updates install over each other. The automatic
# github.token only creates the release; secrets are never echoed.
name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

env:
  GUNGNIR_REQUIRE_PRIVATE_INPUT: "1"

jobs:
  apk:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          packages: platform-tools platforms;android-36 build-tools;36.0.0 ndk;28.2.13676358 cmake;3.22.1
          accept-android-sdk-licenses: true
      - name: Dependency ledger
        run: python3 tools/deps.py verify
      - name: Shader compiler (glslc from the pinned NDK)
        run: |
          echo "$ANDROID_HOME/ndk/28.2.13676358/shader-tools/linux-x86_64" >> "$GITHUB_PATH"
          "$ANDROID_HOME/ndk/28.2.13676358/shader-tools/linux-x86_64/glslc" --version
      - name: Repository check
        run: python3 tools/repository_check.py
      - name: Derive version from tag
        run: |
          TAG="${{ github.ref_name }}"
          VERSION="${TAG#v}"
          if ! echo "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "bad_tag: release tags must look like v1.2.3 (got $TAG)" >&2
            exit 1
          fi
          MAJOR=$(echo "$VERSION" | cut -d. -f1)
          MINOR=$(echo "$VERSION" | cut -d. -f2)
          PATCH=$(echo "$VERSION" | cut -d. -f3)
          echo "GUNGNIR_VERSION_NAME=$VERSION" >> "$GITHUB_ENV"
          echo "GUNGNIR_VERSION_CODE=$((MAJOR * 1000000 + MINOR * 1000 + PATCH))" >> "$GITHUB_ENV"
          echo "version=$VERSION code=$((MAJOR * 1000000 + MINOR * 1000 + PATCH))"
      - name: APK (empty corpus, release-signed, no game data)
        env:
          GUNGNIR_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          GUNGNIR_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          GUNGNIR_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "missing_signing_secret: set ANDROID_KEYSTORE_BASE64 / ANDROID_KEYSTORE_PASSWORD / ANDROID_KEY_ALIAS / ANDROID_KEY_PASSWORD repository secrets" >&2
            exit 1
          fi
          if [ -z "$GUNGNIR_KEYSTORE_PASSWORD" ] || [ -z "$GUNGNIR_KEY_ALIAS" ] || [ -z "$GUNGNIR_KEY_PASSWORD" ]; then
            echo "missing_signing_secret: keystore passwords/alias secrets are empty" >&2
            exit 1
          fi
          KEYSTORE=/tmp/gungnir-release.jks
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$KEYSTORE"
          chmod 600 "$KEYSTORE"
          scripts/android/build.sh --release \
            "-Pgungnir.keystorePath=$KEYSTORE" \
            "-Pgungnir.versionCode=$GUNGNIR_VERSION_CODE" \
            "-Pgungnir.versionName=$GUNGNIR_VERSION_NAME"
      - name: Release files
        run: |
          python3 tools/package_notices.py generate
          APK=android/app/build/outputs/apk/release/app-release.apk
          test -f "$APK"
          OUT=release-files
          mkdir -p "$OUT"
          cp "$APK" "$OUT/gungnir-recomp-empty-${{ github.ref_name }}.apk"
          cp THIRD_PARTY_NOTICES.txt "$OUT/"
          (cd "$OUT" && sha256sum gungnir-recomp-empty-*.apk THIRD_PARTY_NOTICES.txt > SHA256SUMS)
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" --title "${{ github.ref_name }}" --notes "Empty-corpus APK (no game code or data). See docs/RELEASE.md." release-files/*
