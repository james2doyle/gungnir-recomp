# T13d — clean-clone CI: Linux runtime + Android cross-compile.
#
# Policy: zero game artifacts on runners (empty-corpus Android build only),
# fail-closed private inputs (GUNGNIR_REQUIRE_PRIVATE_INPUT=1), every action
# pinned to a full commit SHA with its tag in a comment, least privilege,
# no secrets, concurrency cancellation. Uploads: none (logs stay in the run).
name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  GUNGNIR_REQUIRE_PRIVATE_INPUT: "1"

jobs:
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0 # gitleaks scans history; a shallow clone fails it
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Pinned toolchain versions
        run: |
          cmake --version
          ninja --version
          python3 --version
      - name: Dependency ledger
        run: python3 tools/deps.py verify
      - name: Secret scan
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2
      - name: Notice coverage and licenses
        run: |
          python3 tools/package_notices.py check-coverage
          python3 tools/package_notices.py check-licenses
      - name: REUSE lint
        run: pipx run reuse==6.3.0 lint
      - name: Clean-clone artifact scan
        run: |
          tracked=$(git ls-files | grep -Ei '\.(iso|chd|elf|prx|bin|dar|tpl)$' || true)
          if [ -n "$tracked" ]; then echo "game artifacts tracked:"; echo "$tracked"; exit 1; fi
          echo "no game artifacts tracked"
      - name: Configure and build
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build
      - name: Full synthetic suite
        run: ctest --test-dir build
      - name: Repository check
        run: python3 tools/repository_check.py

  android:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          packages: platform-tools platforms;android-36 build-tools;36.0.0 ndk;28.2.13676358 cmake;3.22.1
          accept-android-sdk-licenses: true
      - name: Dependency ledger
        run: python3 tools/deps.py verify
      - name: Shader compiler (glslc from the pinned NDK)
        run: |
          echo "$ANDROID_HOME/ndk/28.2.13676358/shader-tools/linux-x86_64" >> "$GITHUB_PATH"
          "$ANDROID_HOME/ndk/28.2.13676358/shader-tools/linux-x86_64/glslc" --version
      - name: APK (empty corpus, no game data)
        run: scripts/android/build.sh
